<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/fonts/fonts.css"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
const q = new URLSearchParams(location.search);
const shot = q.get('shot');
const w = Number(q.get('w') || 1080), hgt = Number(q.get('h') || 1440);
await Promise.all(['600 40px "Inter"','400 40px "Inter"','italic 400 40px "Instrument Serif"','400 40px "Instrument Serif"','700 40px "Inter Tight"'].map(f=>document.fonts.load(f)));
const mod = await import(`./shots/${shot}.js`);
const t0 = performance.now();
try {
  const canvas = await mod.render({ width: w, height: hgt, frame: Number(q.get('frame') || 0) });
  window.__ms = performance.now() - t0;
  window.__data = canvas.toDataURL('image/png');
} catch (e) { window.__err = String(e && e.stack || e); }
window.__done = true;
</script></body></html>
